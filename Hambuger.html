<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamburger Menu with Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #333;
        }

        /* HEADER */
        header {
            background: #222;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        h1 {
            font-size: 1.6rem;
        }

        /* Hamburger Button */
        .menu-btn {
            display: none;
            /* hidden on desktop */
            background: none;
            border: none;
            cursor: pointer;
            width: 45px;
            height: 45px;
            position: relative;
        }

        .menu-btn span {
            position: absolute;
            left: 10px;
            width: 25px;
            height: 3px;
            background: white;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn span:nth-child(1) {
            top: 12px;
        }

        .menu-btn span:nth-child(2) {
            top: 20px;
        }

        .menu-btn span:nth-child(3) {
            top: 28px;
        }

        /* Active (X) state */
        .menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -8px);
        }

        /* Navigation Menu */
        .nav-menu {
            display: flex;
            gap: 2rem;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: #00d1b2;
        }

        /* Mobile Menu (hidden by default) */
        .mobile-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100vh;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: left 0.4s ease;
            z-index: 999;
        }

        .mobile-menu.active {
            left: 0;
        }

        .mobile-menu a {
            color: white;
            text-decoration: none;
            font-size: 2rem;
            margin: 1.5rem 0;
            transition: color 0.3s;
        }

        .mobile-menu a:hover {
            color: #00d1b2;
        }

        /* Show hamburger on mobile */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                /* hide desktop nav */
            }

            .menu-btn {
                display: block;
                /* show hamburger */
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>

        <!-- Desktop Navigation -->
        <nav class="nav-menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>

        <!-- Hamburger Button -->
        <button class="menu-btn" id="menuToggle" aria-label="Toggle navigation menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Mobile Menu (slides in from left) -->
    <nav class="mobile-menu" id="mobileMenu">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Just some content so you can scroll -->
    <main style="padding: 2rem; text-align: center;">
        <h2>Welcome to My Website</h2>
        <p>This is a simple responsive hamburger menu example with actual pages/links.</p>
        <p>Resize the browser to see it in action!</p>
    </main>

    <script>
        const menuBtn = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            mobileMenu.classList.toggle('active');
        });

        // Close menu when clicking a link (optional but recommended)
        document.querySelectorAll('.mobile-menu a').forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('active');
                mobileMenu.classList.remove('active');
            });
        });
    </script>

</body>

</html>
